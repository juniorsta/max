services:
  postgres:
    image: postgres:15
    container_name: kera_postgres
    restart: always
    environment:
      POSTGRES_DB: kera_db
      POSTGRES_USER: kera_admin
      POSTGRES_PASSWORD: 3900Mcf!32510
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kera_admin -d kera_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kera_redis
    restart: always
    command: redis-server --requirepass 3900Mcf!32510
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "3900Mcf!32510", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: kera_n8n
    environment:
      N8N_HOST: api.stazak.com.br
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://api.stazak.com.br/
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: kera_postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: kera_db
      DB_POSTGRESDB_USER: kera_admin
      DB_POSTGRESDB_PASSWORD: 3900Mcf!32510
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: 3900Mcf!32510
      GENERIC_TIMEZONE: America/Sao_Paulo
    restart: always
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: kera_evolution
    environment:
      SERVER_URL: https://stazak.com.br
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: 3900Mcf!32510
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://kera_admin:3900Mcf!32510@kera_postgres:5432/kera_db
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:3900Mcf!32510@kera_redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    container_name: kera_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: juniorsta@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 3900Mcf!32510
    restart: always
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: kera_backend
      restart: always
      environment:
        NODE_ENV: production
        PORT: 4000
        DATABASE_URL: postgresql://kera_admin:3900Mcf%2132510@kera_postgres:5432/kera_db
        REDIS_URL: redis://:3900Mcf%2132510@kera_redis:6379
        JWT_SECRET: ${JWT_SECRET}
        WEBHOOK_SECRET: ${WEBHOOK_SECRET}
        EVOLUTION_URL: http://kera_evolution:8080
        EVOLUTION_API_KEY: 3900Mcf!32510
        FRONTEND_URL: https://app.kera.stazak.com.br
        API_URL: https://api.kera.stazak.com.br
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      ports:
        - "4000:4000"
      expose:
        - "4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kera_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.kera.stazak.com.br
    depends_on:
      - backend
    ports:
      - "3000:3000"
    expose:
      - "3000"

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  evolution_data:
  pgadmin_data:
